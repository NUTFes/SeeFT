

services:
  db:
    container_name: nutfes-seeft-db
    image: postgres:18
    volumes:
      - ./postgresql/db:/docker-entrypoint-initdb.d/ # 初期データ
    environment:
      POSTGRES_DB: seeft_db
      POSTGRES_USER: seeft
      POSTGRES_PASSWORD: password
      TZ: 'Asia/Tokyo'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5432:5432

  api:
    container_name: nutfes-seeft-api
    build: ./api
    env_file: ["./api/env/dev.env"]
    # マニュアル閲覧制限（issue #444）: MANUAL_OAUTH_CLIENT_ID / MANUAL_OAUTH_CLIENT_SECRET /
    # MANUAL_OAUTH_REDIRECT_URL / MANUAL_DIR は ./api/env/dev.env 側に追加すること
    volumes:
      - ./api:/app
      - ./manuals:/manuals
    #シェルスクリプトを実行するコマンド
    command: "./start.sh"
    ports:
      - "1234:1234"
    stdin_open: true
    tty: true
    depends_on:
      db: 
        condition: service_started

  # mobile:
  #   container_name: nutfes-seeft-mobile
  #   build: ./mobile
  #   volumes:
  #     - ./mobile:/app
  #   #シェルスクリプトを実行するコマンド
  #   command: "python3 ./python/server.py"
  #   ports:
  #     - "45029:45029"
  #   stdin_open: true
  #   tty: true
  #   depends_on:
  #     api: 
  #       condition: service_started
    

  admin:
    container_name: "nutfes-seeft-admin"
    build: ./admin
    volumes:
      - ./admin:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on: [api]

  schemaspy:
    container_name: nutfes-seeft-schemaspy
    image: schemaspy/schemaspy:6.2.4 
    depends_on:
      db:
        condition: service_healthy
    environment:
      SCHEMASPY_HOST: ${SCHEMASPY_HOST:-db}
      SCHEMASPY_PORT: ${SCHEMASPY_PORT:-5432}
      SCHEMASPY_DB: ${SCHEMASPY_DB:-seeft_db}
      SCHEMASPY_USER: ${SCHEMASPY_USER:-seeft}
      SCHEMASPY_PASSWORD: ${SCHEMASPY_PASSWORD:-password}
      SCHEMASPY_SCHEMA: ${SCHEMASPY_SCHEMA:-public}
    volumes:
      - ./api/docs/schemaspy:/output
    profiles:
      - tools
    command:
      - "-t"
      - "pgsql"
      - "-host"
      - "${SCHEMASPY_HOST:-db}"
      - "-port"
      - "${SCHEMASPY_PORT:-5432}"
      - "-db"
      - "${SCHEMASPY_DB:-seeft_db}"
      - "-u"
      - "${SCHEMASPY_USER:-seeft}"
      - "-p"
      - "${SCHEMASPY_PASSWORD:-password}"
      - "-s"
      - "${SCHEMASPY_SCHEMA:-public}"


