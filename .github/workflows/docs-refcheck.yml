name: docs-refcheck

# ADR（docs/decisions/）の「前提」に書いたファイルとシンボルが、まだ存在するかを確かめる。
# 前提はコード側の変更で古くなるので、ADR を変えた PR に限らず、すべての PR で走らせる。
on:
  pull_request:

permissions:
  contents: read

jobs:
  refcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: refcheck のテスト
        run: python3 -m unittest discover -s scripts/refcheck
      - name: ADR の前提を点検する
        run: python3 scripts/refcheck/refcheck.py docs/decisions/*.md
