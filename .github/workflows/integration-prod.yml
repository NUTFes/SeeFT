name: CI

on:
  push:
    branches:
      - main
      - feat/mitomen/261/CI-CD-Pipeline
  workflow_call:
  workflow_dispatch:

concurrency:
  group: seeft-ci
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}
      
      - name: Set image tag
        id: vars
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: |
          mkdir -p mobile/env
          printf '%s' "${{ secrets.SEEFT_MOBILE_ENVS }}" > mobile/env/.env

      - name: Build and Push API
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/prod.Dockerfile
          push: true
          tags: ghcr.io/nutfes/seeft/api:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=seeft-api
          cache-to: type=gha,mode=max,scope=seeft-api

      - name: Build and Push Admin
        uses: docker/build-push-action@v7
        with:
          context: ./admin
          file: ./admin/prod.Dockerfile
          push: true
          tags: ghcr.io/nutfes/seeft/admin:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=seeft-admin
          cache-to: type=gha,mode=max,scope=seeft-admin

      - name: Build and Push Mobile
        uses: docker/build-push-action@v7
        with:
          context: ./mobile
          file: ./mobile/Dockerfile
          push: true
          tags: ghcr.io/nutfes/seeft/mobile:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=seeft-mobile
          cache-to: type=gha,mode=max,scope=seeft-mobile
      
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: NUTFes
          repositories: k8s-manifests
          permission-contents: write

      - name: Check out k8s manifests repo
        uses: actions/checkout@v6
        with:
          repository: NUTFes/k8s-manifests
          ref: main
          path: k8s-manifests
          token: ${{ steps.app-token.outputs.token }}
      
      - name: Update SeeFT image tag
        run: |
          cd k8s-manifests

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REGISTRY="ghcr.io/nutfes/seeft"

          sed -i "s|image: .*\/api:.*|image: ${REGISTRY}/api:${{ steps.vars.outputs.image_tag }}|g" seeft/deployment.yml
          sed -i "s|image: .*\/admin:.*|image: ${REGISTRY}/admin:${{ steps.vars.outputs.image_tag }}|g" seeft/deployment.yml
          sed -i "s|image: .*\/mobile:.*|image: ${REGISTRY}/mobile:${{ steps.vars.outputs.image_tag }}|g" seeft/deployment.yml

          git add seeft/deployment.yml

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "chore(seeft): update image tag to ${{ steps.vars.outputs.image_tag }}"
          git pull --rebase origin main
          git push origin HEAD:main

