name: CI

on:
  push:
    branches:
      - main
      - feat/mitomen/261/CI-CD-Pipeline
  workflow_call:
  workflow_dispatch:

concurrency:
  group: seeft-ci
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}
      
      - name: Set image tag
        id: vars
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: |
          mkdir -p mobile/env
          printf '%s' "${{ secrets.SEEFT_MOBILE_ENVS }}" > mobile/env/.env

      - name: Build and Push API
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/prod.Dockerfile
          push: true
          tags: ghcr.io/nutfes/seeft/api:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=seeft-api
          cache-to: type=gha,mode=max,scope=seeft-api

      - name: Build and Push Admin
        uses: docker/build-push-action@v7
        with:
          context: ./admin
          file: ./admin/prod.Dockerfile
          push: true
          tags: ghcr.io/nutfes/seeft/admin:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=seeft-admin
          cache-to: type=gha,mode=max,scope=seeft-admin

      - name: Build and Push Mobile
        uses: docker/build-push-action@v7
        with:
          context: ./mobile
          file: ./mobile/Dockerfile
          push: true
          tags: ghcr.io/nutfes/seeft/mobile:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=seeft-mobile
          cache-to: type=gha,mode=max,scope=seeft-mobile

  trigger-cd:
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deployment-prod.yml
    secrets: inherit
  
  trigger-k8s-CI:
    needs: build-and-push
    uses: ./.github/workflows/k8s-CI.yml
    with:
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
    secrets: inherit
