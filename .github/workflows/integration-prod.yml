name: CI

on:
  push:
    branches:
      - main
      - feat/mitomen/261/CI-CD-Pipeline
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}
      
      - name: Set image tag
        id: vars
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure Insecure Registry
        run: |
          sudo service docker stop
          echo "{\"insecure-registries\": [\"${{ secrets.HARBOR_REG }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo service docker start

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ secrets.HARBOR_REG }}"]
              http = true
              insecure = true

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REG }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Create .env file
        run: |
          mkdir -p mobile/env
          printf '%s' "${{ secrets.SEEFT_MOBILE_ENVS }}" > mobile/env/.env

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/prod.Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REG }}/seeft/api:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha

      - name: Build and Push Admin
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/prod.Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REG }}/seeft/admin:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha

      - name: Build and Push Mobile
        uses: docker/build-push-action@v5
        with:
          context: ./mobile
          file: ./mobile/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REG }}/seeft/mobile:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
      
      - name: Check out k8s manifests repo
        uses: actions/checkout@v6
        with:
          repository: NUTFes/k8s-manifests
          ref: main
          path: k8s-manifests
          token: ${{ secrets.K8S_MANIFESTS_PAT }}
      
      - name: Update SeeFT image tag
        run: |
          cd k8s-manifests

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          sed -i "s|image: reg.nutmeg.cloud/seeft/api:.*|image: reg.nutmeg.cloud/seeft/api:${{ steps.vars.outputs.image_tag }}|g" seeft/deployment.yml
          sed -i "s|image: reg.nutmeg.cloud/seeft/admin:.*|image: reg.nutmeg.cloud/seeft/admin:${{ steps.vars.outputs.image_tag }}|g" seeft/deployment.yml
          sed -i "s|image: reg.nutmeg.cloud/seeft/mobile:.*|image: reg.nutmeg.cloud/seeft/mobile:${{ steps.vars.outputs.image_tag }}|g" seeft/deployment.yml

          git add seeft/deployment.yml

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "chore(seeft): update image tag to ${{ steps.vars.outputs.image_tag }}"
          git push origin main

