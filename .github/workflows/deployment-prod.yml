name: CD

on:
  workflow_dispatch:
    inputs:
      branch:
        description: デプロイするブランチ名
        required: true
        type: string

concurrency:
  group: seeft-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production

    # 本番環境のself-hosted-runnerで
    runs-on: 
      - self-hosted
      - linux
      - seeft-prod
    
    environment: production
    timeout-minutes: 60

    env:
      DEPLOY_BRANCH: ${{ inputs.branch }}
      DEPLOY_DIRECTORY: ${{ vars.DEPLOY_DIRECTORY }}
      COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
      CONTAINER_IP: ${{ vars.CONTAINER_IP }}

    steps:      
      - name: Deploy
        run: |
          ssh deploy-user@"$CONTAINER_IP" \
            "cd '$DEPLOY_DIRECTORY' && /opt/deploy/deploy.sh '$DEPLOY_BRANCH' '$GITHUB_RUN_ID' '$COMPOSE_FILE'"