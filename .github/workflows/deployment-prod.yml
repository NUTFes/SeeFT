name: CD

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    permissions:
      contents: read
      packages: read

    steps:
      - name: Add deploy host key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -R "${{ secrets.CONTAINER_IP }}" 2>/dev/null || true
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: SSH and Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          export IMAGE_TAG="${GITHUB_SHA::7}"  

          ssh deploy-user@${{ secrets.CONTAINER_IP }} -T \
            -o SendEnv=GHCR_TOKEN \
            -o SendEnv=GHCR_USERNAME \
            -o SendEnv=IMAGE_TAG \
            bash -s << 'EOF'
            set -e

            cd /home/deploy-user/SeeFT

            git fetch origin feat/mitomen/261/CI-CD-Pipeline
            git reset --hard origin/feat/mitomen/261/CI-CD-Pipeline
            git checkout -B feat/mitomen/261/CI-CD-Pipeline origin/feat/mitomen/261/CI-CD-Pipeline
            
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            docker compose -f docker-compose.cd.yml pull
            docker compose -f docker-compose.cd.yml up -d

            docker image prune -f
          EOF