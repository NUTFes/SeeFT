name: CD

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: SSH and Deploy
        run: |
          ssh -o StrictHostKeyChecking=no deploy-user@${{ secrets.CONTAINER_IP }} << 'EOF'
            set -e
            cd /home/deploy-user/SeeFT-Actions-Test
            echo '${{ secrets.HARBOR_PASS }}' | docker login '${{ secrets.HARBOR_REG }}' -u '${{ secrets.HARBOR_USERNAME }}' --password-stdin
            docker compose -f docker-compose.cd.yml pull
            docker compose -f docker-compose.cd.yml up -d
            docker image prune -f
          EOF