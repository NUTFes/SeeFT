name: CD

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Add deploy host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.CONTAINER_IP }}" >> ~/.ssh/known_hosts

      - name: SSH and Deploy
        run: |
          ssh deploy-user@${{ secrets.CONTAINER_IP }} << 'EOF'
            set -e
            cd /home/deploy-user/SeeFT
            git config --global --add safe.directory /home/deploy-user/SeeFT
            git fetch origin feat/mitomen/261/CI-CD-Pipeline
            git reset --hard origin/feat/mitomen/261/CI-CD-Pipeline
            git checkout -B feat/mitomen/261/CI-CD-Pipeline origin/feat/mitomen/261/CI-CD-Pipeline
            echo '${{ secrets.HARBOR_PASS }}' | docker login '${{ secrets.HARBOR_REG }}' -u '${{ secrets.HARBOR_USERNAME }}' --password-stdin
            docker compose -f docker-compose.cd.yml pull
            docker compose -f docker-compose.cd.yml up -d
            docker image prune -f
          EOF
